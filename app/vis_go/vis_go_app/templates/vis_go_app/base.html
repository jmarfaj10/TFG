{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vis GO - Dashboard{% endblock %}</title>
    <link rel="icon" type="image/jpeg" href="{% static 'img/logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/output.css' %}?v=15">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-zinc-900 text-slate-100">
    <header class ="p-3 border-b border-zinc-800">
        <div class="flex justify-center items-center gap-2">
            <img src="{% static 'img/logo.png' %}" alt="Vis GO Logo" class="h-10 w-10 rounded-xl shadow-lg border border-cyan-500/30"/>
        </div>
        <nav class="flex justify-between items-center gap-x-7 mt-4">
            <div class="flex gap-4">
                <a href="{% url 'index' %}">Home</a>
                <a href="{% url 'controlPanel' %}">Control Panel</a>
                <a href="{% url 'logs' %}">logs</a>
                <a href="{% url 'about' %}">About</a>
            </div>
            <div class="flex gap-4">
                {% if user.is_authenticated %}
                    <p>Welcome, {{ user.username }}</p>
                    <a href="{% url 'logout' %}">logout</a>
                {% else %}
                    <a href="{% url 'login' %}">login</a>
                    <a href="{% url 'singup' %}">singup</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main class="mx-auto p-8">
        {% block content %}
        {% endblock %}
    </main>

    <script src="{% static 'js/flowbite.min.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
