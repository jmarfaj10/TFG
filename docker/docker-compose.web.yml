# ─── SOLO LA WEB ─────────────────────────────────────────────────────
# Levanta únicamente la web Django. Pensado para tu PC.
#
#   cd ~/TFG/docker
#   docker compose -f docker-compose.web.yml up --build
#
# Luego abre: http://localhost:8000
services:

  web:
    build:
      context: ..                        # raíz del repo (~/TFG)
      dockerfile: docker/web/Dockerfile
    image: mi_robot/web
    ports:
      - "8000:8000"
