# ─── STACK COMPLETO: web + nodos ROS2 + rosbridge ────────────────────
# Es el compose por defecto, así que basta con:
#
#   cd ~/TFG/docker
#   docker compose up --build
#
# En el ROBOT, si solo quieres el ROS2, puedes levantar servicios sueltos:
#   docker compose up --build ros2_nodes rosbridge
services:

  # ─── Nodos ROS2 (robot) ───────────────────────────
  ros2_nodes:
    build:
      context: ..                              # raíz del repo (~/TFG)
      dockerfile: docker/ros2_nodes/Dockerfile
    image: mi_robot/ros2_nodes
    network_mode: host                         # DDS/ROS2 discovery en la red local
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - USE_SIM_TIME=${USE_SIM_TIME:-false}    # ponlo a true al usar Gazebo

  # ─── rosbridge (robot) ────────────────────────────
  rosbridge:
    build:
      context: ./rosbridge
      dockerfile: Dockerfile
    image: mi_robot/rosbridge
    network_mode: host                         # expone el websocket en :9090 del host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    depends_on:
      - ros2_nodes

  # ─── Web Django (PC) ──────────────────────────────
  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    image: mi_robot/web
    ports:
      - "8000:8000"
